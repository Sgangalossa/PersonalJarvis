name: CodeQL SARIF diagnostic export

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  sarif-export:
    name: SARIF (${{ matrix.language }})
    if: github.event.pull_request.number == 1
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build_mode: none
          - language: javascript-typescript
            build_mode: none
          - language: ruby
            build_mode: none
          - language: cpp
            build_mode: none
    steps:
      - name: Checkout PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build_mode }}

      - name: Analyze and retain SARIF locally
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          output: sarif-output/${{ matrix.language }}
          upload: never

      - name: Upload diagnostic SARIF artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.6.2
        with:
          name: codeql-sarif-${{ matrix.language }}-${{ github.run_id }}
          path: sarif-output/${{ matrix.language }}/
          if-no-files-found: error
          retention-days: 14
