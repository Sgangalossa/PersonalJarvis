name: CodeQL annotation diagnostic export

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  checks: read

jobs:
  export-annotations:
    name: Export CodeQL alert annotations
    if: github.event.pull_request.number == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for the CodeQL check and export its annotations
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p codeql-diagnostic
          found=false

          for attempt in $(seq 1 90); do
            checks="$(gh api -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/check-runs?per_page=100")"
            check_id="$(jq -r '[.check_runs[] | select(.name == "CodeQL")] | sort_by(.started_at // "") | last | .id // empty' <<< "$checks")"

            if [[ -n "$check_id" ]]; then
              status="$(gh api "repos/${GITHUB_REPOSITORY}/check-runs/${check_id}" --jq '.status')"
              if [[ "$status" == "completed" ]]; then
                gh api -H 'Accept: application/vnd.github+json' \
                  "repos/${GITHUB_REPOSITORY}/check-runs/${check_id}/annotations?per_page=100" \
                  > codeql-diagnostic/annotations.json
                printf '%s\n' "$check_id" > codeql-diagnostic/check-run-id.txt
                jq '[.[] | {path, start_line, end_line, annotation_level, title, message}]' \
                  codeql-diagnostic/annotations.json > codeql-diagnostic/annotations-review.json
                found=true
                break
              fi
            fi
            sleep 10
          done

          if [[ "$found" != "true" ]]; then
            echo "A completed CodeQL check with readable annotations was not found within 15 minutes." >&2
            exit 1
          fi
          echo "Exported $(jq 'length' codeql-diagnostic/annotations.json) CodeQL annotations."

      - name: Upload annotations for triage
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.6.2
        with:
          name: codeql-annotations-${{ github.run_id }}
          path: codeql-diagnostic/
          if-no-files-found: error
          retention-days: 14
